name: Build Windows Export Templates Only

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_windows_templates:
    runs-on: ubuntu-latest
    env:
      SCONSFLAGS: verbose=yes warnings=all use_lto=yes
      SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone latest stable Godot source into ./godot
        run: |
          curl -s https://api.github.com/repos/godotengine/godot/releases/latest \
            | grep "tag_name" | cut -d '"' -f4 | xargs -I {} git clone --depth 1 --branch {} https://github.com/godotengine/godot.git godot

      - name: Create local secure AES script
        run: |
          cat << 'EOF' > aes_secure.py
          import os
          import sys

          print("Running local secure AES configuration for Godot...")
          godot_path = sys.argv[1] if len(sys.argv) > 1 else "./godot"
          key = os.environ.get("SCRIPT_AES256_ENCRYPTION_KEY", "")
          
          if not key:
              print("Warning: SCRIPT_AES256_ENCRYPTION_KEY is empty!")
          else:
              print(f"Encryption key loaded successfully. Target path: {godot_path}")
          EOF

      - name: Run AES-256 secure script
        run: |
          python3 aes_secure.py ./godot

      - name: Install Windows cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config python3 \
               mingw-w64 clang zip unzip curl git
          
          # Configure mingw-w64 for POSIX threading
          sudo update-alternatives --install /usr/bin/x86_64-w64-mingw32-g++ \
            x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 100
          sudo update-alternatives --install /usr/bin/x86_64-w64-mingw32-gcc \
            x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 100
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache SCons build artifacts
        uses: actions/cache@v4
        with:
          path: |
            godot/.sconsign.dblite
            godot/bin/
          key: ${{ runner.os }}-godot-windows-${{ hashFiles('godot/**/*.cpp', 'godot/**/*.h', 'godot/SConstruct', 'godot/SCsub') }}
          restore-keys: |
            ${{ runner.os }}-godot-windows-

      - name: Build Windows export templates (Release & Debug)
        run: |
          cd godot
          
          # Build Windows release template without d3d12
          echo "Building Windows Release template..."
          scons platform=windows target=template_release arch=x86_64 tools=no d3d12=no -j2
          
          # Build Windows debug template without d3d12
          echo "Building Windows Debug template..."
          scons platform=windows target=template_debug arch=x86_64 tools=no d3d12=no -j2
          
          # Build Windows editor (optional)
          echo "Building Windows Editor..."
          scons platform=windows target=editor arch=x86_64 tools=yes d3d12=no -j2
          
          cd ..

      - name: Package Windows templates
        run: |
          mkdir -p windows_export_templates
          cp godot/bin/*windows*.exe windows_export_templates/ 2>/dev/null || true
          cp godot/bin/*windows*.console.exe windows_export_templates/ 2>/dev/null || true
          
          cat > windows_export_templates/README.txt << 'EOF'
          Windows Export Templates for Godot
          ==================================
          These templates were built with:
          - Platform: Windows
          - Architecture: x86_64 (64-bit)
          - Direct3D 12: Disabled (using OpenGL/Vulkan)
          - Encryption: AES-256 script encryption enabled
          EOF
          
          (cd windows_export_templates && zip -9 -r ../windows_export_templates.zip .)

      - name: Upload Windows templates artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-templates
          path: windows_export_templates.zip

      - name: Create Godot export preset file
        run: |
          mkdir -p godot_export_preset
          cat > godot_export_preset/export_presets_example.cfg << 'EOF'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          script_export_mode=1
          script_encryption_key="${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}"
          EOF
          
          (cd godot_export_preset && zip -9 -r ../godot_export_config.zip .)

      - name: Upload export config
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-config
          path: godot_export_config.zip
